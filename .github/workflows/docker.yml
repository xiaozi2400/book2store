name: Docker Build & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: 代码检查（复用 ci.yml 的 lint）
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --quiet ruff
      - name: Run ruff
        run: ruff check .

  # Job 2: 测试（复用 ci.yml 的 test）
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet pytest ruff pytest-cov -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/unit -v --tb=short --cov=automation --cov-report=xml --cov-report=html
      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # Job 3: 构建并推送 Docker 镜像
  build:
    name: docker build & push
    runs-on: ubuntu-latest
    needs: [lint, test]  # 等待 lint 和 test 完成
    if: github.event_name == 'push'  # 仅 push 时构建，PR 时只跑 lint 和 test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Docker Buildx 支持多架构构建
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 GitHub Container Registry (ghcr.io)
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 提取元数据（生成 tags 和 labels）
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/book2store
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # 构建并推送镜像
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
