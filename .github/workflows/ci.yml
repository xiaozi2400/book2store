name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pytest && python -m pip install --quiet -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/unit -v --tb=short

      - name: Run integration tests
        run: python -m pytest tests/integration -v --tb=short
