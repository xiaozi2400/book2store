# 电子书自动化处理系统配置文件

# 路径配置
paths:
  input_dir: "E:\\ebooks\\input"
  output_dir: "./output"
  data_dir: "./data"
  log_dir: "./logs"

# SKU配置
sku:
  - name: "纯英文原版"
    price: 3.99
    includes:
      - "english_pdf"
  - name: "完整套装"
    price: 8.99
    includes:
      - "english_pdf"
      - "chinese_pdf"
      - "bilingual_pdf"
      - "summary_pdf"

# AI配置
ai:
  provider: "deepseek"
  model: "deepseek-chat"
  max_tokens: 4096
  temperature: 0.7
  retry_times: 3
  retry_delay: 5

# 精简版生成配置
summarizer:
  core_insight_length: "300-500"
  chapter_summary_length: "150-200"
  max_quotes: 15
  max_content_length: 10000
  prompt: |
    你是一位专业的书籍摘要专家。请为以下书籍内容生成精简摘要：

    【书名】: {title}
    【作者】: {author}

    【要求】:
    1. 核心观点：用 {core_insight_length} 字概括全书核心思想
    2. 章节摘要：为每个章节生成 {chapter_summary_length} 字摘要
    3. 金句摘录：提取 {max_quotes} 条最有价值的句子
    4. 适用人群：说明这本书适合谁阅读

    【内容】:
    {content}

    请以以下 JSON 格式输出：
    {{
        "core_insight": "全书核心观点...",
        "chapter_summaries": [
            {{"chapter": "第1章标题", "summary": "摘要..."}}
        ],
        "quotes": ["金句1", "金句2", ...],
        "target_audience": "适用人群..."
    }}

# 图片配置
image:
  max_width: 1200
  max_height: 1600
  quality: 85
  format: "jpg"

# 闲管家配置
xianyu:
  login_method: "qr_code"
  base_url: "https://www.xianyu.com"
  timeout: 30
  auto_retry: true

# 错误处理配置
error_handling:
  api_error: "retry"
  file_error: "skip"
  parse_error: "skip"
  publish_error: "manual"
