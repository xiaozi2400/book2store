# 电子书自动化处理系统配置文件

# 路径配置
paths:
  input_dir: "E:\\ebooks\\input"
  output_dir: "./output"
  data_dir: "./data"
  log_dir: "./logs"

# SKU配置
sku:
  - name: "英文原版"
    price: 1.99
    includes:
      - "english_pdf"
  - name: "英文+双语+中译"
    price: 5.99
    includes:
      - "english_pdf"
      - "chinese_pdf"
      - "bilingual_pdf"
      - "summary_pdf"

# AI配置
ai:
  provider: "deepseek"
  max_tokens: 4096
  temperature: 0.7
  retry_times: 3
  retry_delay: 5

# MiniMax AI配置
minimax:
  enabled: true
  provider: "minimax"
  model: "MiniMax-M2.7"  # MiniMax 2.7 模型
  api_key: ""  # 请设置环境变量 MINIMAX_API_KEY
  api_url: "https://api.minimax.io/v1/text/chatcompletion_v2"
  max_tokens: 4096
  temperature: 0.7
  retry_times: 3

# 精简版适合度评估配置
suitability_eval:
  version: "1.1"
  # 前置检查：不符合条件的书籍直接跳过
  precheck:
    min_pages: 150
    exclude_types:
      - "小说"
      - "诗歌"
      - "散文"
      - "回忆录"
      - "自传"
      - "故事集"
      - "文集"
      - "Novel"
      - "Poetry"
      - "Essay"
      - "Memoir"
      - "Fiction"
      - "Anthology"
      - "Autobiography"
  # 评估标准
  criteria:
    - id: "q1_purpose"
      question: "读者阅读目的是学会怎么做，而非体验阅读过程"
      weight: 3
      keywords_true:
        - "如何"
        - "步骤"
        - "指南"
        - "手册"
        - "实战"
        - "教程"
        - "入门"
        - "精通"
        - "Blueprint"
        - "Workshop"
        - "for Dummies"
        - "Cookbook"
        - "Handbook"
        - "Guide"
        - "How-to"
        - "Step-by-step"
        - "101"
        - "Mastering"
      keywords_false:
        - "回忆录"
        - "自传"
        - "小说"
        - "散文"
        - "诗歌"
        - "故事集"
        - "文集"
        - "Memoir"
        - "Novel"
        - "Poetry"
        - "Fiction"
        - "Anthology"
        - "Autobiography"
    - id: "q2_extractable"
      question: "核心价值可以提取、概括、结构化而不失真"
      weight: 3
      keywords_true:
        - "框架"
        - "模型"
        - "方法论"
        - "原则"
        - "模式"
        - "清单"
        - "模板"
        - "策略"
        - "系统"
        - "Framework"
        - "Methodology"
        - "Principles"
        - "Patterns"
        - "Checklist"
        - "Template"
        - "Strategy"
        - "System"
        - "Process"
        - "Best Practice"
      keywords_false:
        - "纯叙事"
        - "个人感悟"
        - "无结构"
        - "漫谈"
        - "Narrative Only"
        - "Personal Reflection"
        - "Unstructured"
    - id: "q3_executable"
      question: "读者读完精简版后能够独立执行核心任务"
      weight: 4
      keywords_true:
        - "代码"
        - "实现"
        - "配置"
        - "部署"
        - "操作"
        - "练习"
        - "实验"
        - "项目"
        - "实战"
        - "动手"
        - "Code"
        - "Implementation"
        - "Configuration"
        - "Deployment"
        - "Exercise"
        - "Lab"
        - "Project"
        - "Task"
        - "Recipe"
        - "How-to"
      keywords_false:
        - "纯理论"
        - "原理探讨"
        - "概念介绍"
        - "思想随笔"
        - "Theoretical Only"
        - "Concept Introduction"
        - "Philosophy"
  # 决策阈值
  decision:
    excellent_threshold: 8
    good_threshold: 6
    caution_threshold: 4
    excellent_label: "非常适合"
    good_label: "适合"
    caution_label: "谨慎适合"
    poor_label: "不适合"

# 图片配置
summarizer:
  core_insight_length: "300-500"
  chapter_summary_length: "150-200"
  max_quotes: 10
  max_content_length: 100000
  prompt: |
    你是一位专业的书籍摘要专家。请为以下书籍内容生成精简摘要：
    
    【书名】: {title}
    【作者】: {author}
    
    【要求】:
    1. 核心观点：用 {core_insight_length} 字概括全书核心思想
    2. 章节摘要：为每个章节生成 {chapter_summary_length} 字摘要
    3. 金句摘录：提取 {max_quotes} 条最有价值的句子，翻译成中文后输出
    4. 适用人群：说明这本书适合谁阅读
    5. 重要：不要输出书名和作者行
    
    【内容】:
    {content}
    
    请直接以 Markdown 格式输出，不要任何包裹：
    
    ## 核心观点
    
    [核心观点内容]
    
    ## 章节摘要
    
    ### [章节标题1]
    
    [章节摘要内容1]
    
    ### [章节标题2]
    
    [章节摘要内容2]
    
    ## 金句摘录
    
    - [金句1]
    - [金句2]
    - [金句3]
    
    ## 适用人群
    
    [适用人群说明]

# 质量检查配置
quality_check:
  enabled: true
  thresholds:
    excellent: 90
    good: 75
    pass: 60
  dimensions:
    fidelity: true
    fluency: true
    consistency: true
    format: true
    terminology: true
    cultural: true
    completeness: true
    pdf_toc_links: true

# 文案生成配置
copywriting:
  xianyu_listing_prompt: |
    你是一个闲鱼电子书卖家。以下是该书的摘要内容，请基于此生成商品文案。

    书名：{title}
    作者：{author}

    【书籍摘要】
    {summary}

    ## 生成闲鱼销售文案

    基于以上摘要内容，撰写一篇600字以内的书籍文案。

    ### 要求：
    - 语气简洁接地气，带"实话实说"的诚实感，不吹不黑，甚至可自曝槽点
    - 禁止出现"震撼全球""改变命运"等夸张词汇

    ### 文案必须包含以下模块（顺序可微调）：

    爆款标题（只输出文字，不要输出"爆款标题"四个字，不超过20个字符）

    【作者简介】

    【一句话总结】

    【适合谁看】

    【核心内容】（3-5个要点，用简洁短语或短句）

    【优点】（2-4条）

    【缺点】（不超过3条，客观指出槽点）

    【个人看法】（短评，明确说"建议哪些人买"和"哪些人不适合买"）

    ### 固定内容（必须原样附在文案末尾）

    两种版本可选：
    1、英文原版；
    2、英文+中译+双语；

    【注意】
    虚拟商品、发货后不支持退换，有问题随时私聊

    【声明】所有资料均来自网络公开渠道，仅供学习交流使用，所有版权归版权方所有，收费为资料整理费用，非书籍自身价值，如版权方认为侵犯了您的版权，请及时联系小店删除

    ### 相关标签

    只输出5-8个标签，以 # 开头，空格分隔，不输出"相关标签"等字。示例：#标签1 #标签2

  xiaohongshu_note_prompt: |
    你是一位小红书读书博主。请为以下书籍生成种草笔记。

    书名：{title}
    作者：{author}

    【要求】:
    1. 标题：爆款风格，带 emoji，20字内
    2. 正文：
       - 开头：痛点引入或金句
       - 中间：书籍介绍 + 核心价值
       - 结尾：推荐理由 + 获取方式
    3. 使用 emoji 增加可读性
    4. 语气：亲切、真实、像朋友推荐
    5. 结尾加上：#读书 #好书推荐 #书单 #自我提升 #英文原版

    请按 Markdown 格式输出。

# 图片配置
image:
  max_width: 1200
  max_height: 1600
  quality: 85
  format: "jpg"

# 闲管家配置
xianyu:
  login_method: "qr_code"
  base_url: "https://seller.goofish.com"
  timeout: 30
  auto_retry: true
  inventory: 100
  location: "深圳北站"
  shipping: "包邮"
  cookie_path: "data/xianyu_cookie.json"
  max_retries: 3
  retry_interval: 2

# 错误处理配置
error_handling:
  api_error: "retry"
  file_error: "skip"
  parse_error: "skip"
  publish_error: "manual"

# 图片生成器配置
image_generator:
  enabled: true
  width: 800
  height: 800
  # 截图物理像素密度倍率(对应 CSS 800×800 → 输出 1600×1600 物理像素)
  device_scale_factor: 2
  # 容器截图的 JPEG 质量(0-100),Playwright 默认 80 偏低 
  screenshot_quality: 92
  # 配色方案池 — 每次生成随机选一套(每套 4 色对应图 1/2/3/4)
  # theme: dark=深色底白字(默认) / light=浅色底深字
  color_theme: dark
  palettes:
    # ── 深色系 ──
    - name: 经典深沉
      theme: dark
      colors: ["#1A365D", "#276749", "#553C9A", "#9B2C2C"]  # 海洋蓝 / 森林绿 / 皇家紫 / 酒红
    - name: 午夜宝石
      theme: dark
      colors: ["#1E1B4B", "#134E4A", "#78350F", "#7F1D1D"]  # 靛蓝 / 深松石 / 咖啡棕 / 深红
    - name: 暮色都市
      theme: dark
      colors: ["#0F172A", "#4C1D95", "#831843", "#065F46"]  # 石板黑 / 深紫 / 玫红 / 翡翠
    - name: 高级商务
      theme: dark
      colors: ["#1F2937", "#374151", "#7C2D12", "#1E40AF"]  # 石板灰 / 炭灰 / 焦糖 / 深邃蓝
    - name: 秋日大地
      theme: dark
      colors: ["#78350F", "#3F6212", "#7C2D12", "#365314"]  # 咖啡棕 / 橄榄绿 / 焦糖 / 苔绿
    - name: 极光冷调
      theme: dark
      colors: ["#0C4A6E", "#134E4A", "#312E81", "#1E3A8A"]  # 深天青 / 深松石 / 靛青 / 皇家蓝
    - name: 深夜霓虹
      theme: dark
      colors: ["#4A044E", "#164E63", "#7C2D12", "#1E1B4B"]  # 深紫红 / 深青 / 焦糖 / 午夜靛
    - name: 摩登轻奢
      theme: dark
      colors: ["#3F3F46", "#701A75", "#134E4A", "#7C2D12"]  # 深灰 / 洋红 / 深松石 / 焦糖
    # ── 浅色系 ──
    - name: 暖阳纸页
      theme: light
      colors: ["#FEF9F0", "#E8D5B7", "#C4A882", "#8B6914"]  # 暖白 / 奶黄 / 焦糖 / 深金
    - name: 薄荷静谧
      theme: light
      colors: ["#F0F7F4", "#B2D4C8", "#5B8A72", "#2D5A45"]  # 薄荷白 / 浅绿 / 苔绿 / 深松
    - name: 柔暮玫瑰
      theme: light
      colors: ["#FDF5F7", "#E8D0D8", "#A85C7C", "#6B334D"]  # 腮红白 / 浅玫瑰 / 酒玫瑰 / 深玫
    - name: 晴空蓝调
      theme: light
      colors: ["#F0F5FC", "#B8CCEA", "#4A6FA5", "#2C4A7C"]  # 天蓝白 / 浅蓝 / 钴蓝 / 深蓝
    - name: 薰衣草田
      theme: light
      colors: ["#F5F3F9", "#D8CCE8", "#8B6FAE", "#5A4070"]  # 薰衣草白 / 浅紫 / 紫藤 / 深紫
    - name: 水泥极简
      theme: light
      colors: ["#F5F5F3", "#D4D0C8", "#7A7670", "#3D3B38"]  # 暖灰白 / 浅灰 / 中灰 / 深灰
  design_prompt: |
      为下列书籍规划 4 张 800x800 商品主图方案(PPT 高级感)。
      图 2/3/4 布局**固定**:图2=2x2网格,图3=标签展示,图4=双栏对比。

      书名：{title}  作者：{author}  封面配色：{cover_colors}
      摘要：{summary}

      # 项数(从摘要提炼)
      N2=能学到的知识点数,**固定 4** | N3=目标读者类别数,3~5 | N4=主要模块/目录内容,≤10

      # 配色(本次已为你选定:**{palette_name}**,渲染器自动分配 4 色到图 1/2/3/4,深浅主题由配置决定,你不需要回写 HEX)
      {palette_lines}

      # 输出格式(严格,无 markdown 无解释)
      视觉方向: <一个词>
      图3 项数: <3|4|5>
      图4 项数: <5|6|7|8|9|10>

  html_prompt: |
      {design_plan}

      按上方"设计方案"和下列书籍信息,输出**纯 JSON**(不要 markdown 代码块,不要解释)描述 4 张主图内容。CSS/HTML 骨架和布局由渲染器提供,你只填内容。

      书名：{title}   作者：{author} 
      摘要：{summary}

      # 输出 schema(必须严格匹配,键与结构不可变;page2/3/4 是**对象**{"items":[...]},不是数组!)
      {
        "page1": {"title": "书名(中文,≤14字)", "author": "作者名", "subline": "3~4关键词·分隔", "quote": "卖点≤20字"},
        "page2": {"items": [{"icon":"🧠","title":"标题≤7字","desc":"说明≤24字"}, ...共 4 项]},
        "page3": {"items": [{"icon":"🎓","label":"人群≤4字","desc":"理由≤10字"}, ...N3 项]},
        "page4": {"items": [{"chapter":"第N章 章节名(≤14字,必带\"第N章\"前缀)","brief":"章节要点≤22字，>=10字"}, ...N4 项]}
      }

      # 规则
      1. page2 items 恒为 4 项;page3 = N3 项(3~5);page4 = N4 项(5~10)
      2. page4 **必须覆盖全书完整目录**,不得截断/省略后段章节。当实际章节数 > N4 时,按主题相关性把相邻章节**合并**为一项(相邻/主题相近才合并,不跨大板块),使总项数等于 N4;合并后 chapter 用范围表示,如"第一~三章 章节名"或"第1-3章 章节名";brief 覆盖被合并章节的共同要点
      3. page4 chapter 字段**必须**以"第一章/第二章/..."或"第1章/第2章/..."(中文数字优先)开头,顺序对应书的章节顺序;合并项按前述范围格式;brief 是该章节的一句话要点
      4. 允许 emoji:🧠 ⚡ 🎯 🔋 📌 🚀 💡 📚 🎓 ✍️ 👨‍💻 📐 🧭 🌱 ✅
      5. 只输出 JSON 对象本身,首字符 `{`,末字符 `}`

# EPUB 质量检查器配置
epub_checker:
  epubcheck_path: "C:/tools/epubcheck-5.3.0/epubcheck.jar"
  java_opts: ["-Xmx1g"]
  default_profile: default
  default_mode: exp
  timeout_seconds: 300
