# 电子书自动化处理系统配置文件

# 路径配置
paths:
  input_dir: "E:\\ebooks\\input"
  output_dir: "./output"
  data_dir: "./data"
  log_dir: "./logs"

# SKU配置
sku:
  - name: "英文原版"
    price: 1.99
    includes:
      - "english_pdf"
  - name: "英文+双语+中译+精简版"
    price: 5.99
    includes:
      - "english_pdf"
      - "chinese_pdf"
      - "bilingual_pdf"
      - "summary_pdf"

# AI配置
ai:
  provider: "deepseek"
  max_tokens: 4096
  temperature: 0.7
  retry_times: 3
  retry_delay: 5

# MiniMax AI配置
minimax:
  enabled: true
  provider: "minimax"
  model: "MiniMax-M2.7"  # MiniMax 2.7 模型
  api_key: ""  # 请设置环境变量 MINIMAX_API_KEY
  api_url: "https://api.minimax.io/v1/text/chatcompletion_v2"
  max_tokens: 4096
  temperature: 0.7
  retry_times: 3

# 精简版适合度评估配置
suitability_eval:
  version: "1.1"
  # 前置检查：不符合条件的书籍直接跳过
  precheck:
    min_pages: 150
    exclude_types:
      - "小说"
      - "诗歌"
      - "散文"
      - "回忆录"
      - "自传"
      - "故事集"
      - "文集"
      - "Novel"
      - "Poetry"
      - "Essay"
      - "Memoir"
      - "Fiction"
      - "Anthology"
      - "Autobiography"
  # 评估标准
  criteria:
    - id: "q1_purpose"
      question: "读者阅读目的是学会怎么做，而非体验阅读过程"
      weight: 3
      keywords_true:
        - "如何"
        - "步骤"
        - "指南"
        - "手册"
        - "实战"
        - "教程"
        - "入门"
        - "精通"
        - "Blueprint"
        - "Workshop"
        - "for Dummies"
        - "Cookbook"
        - "Handbook"
        - "Guide"
        - "How-to"
        - "Step-by-step"
        - "101"
        - "Mastering"
      keywords_false:
        - "回忆录"
        - "自传"
        - "小说"
        - "散文"
        - "诗歌"
        - "故事集"
        - "文集"
        - "Memoir"
        - "Novel"
        - "Poetry"
        - "Fiction"
        - "Anthology"
        - "Autobiography"
    - id: "q2_extractable"
      question: "核心价值可以提取、概括、结构化而不失真"
      weight: 3
      keywords_true:
        - "框架"
        - "模型"
        - "方法论"
        - "原则"
        - "模式"
        - "清单"
        - "模板"
        - "策略"
        - "系统"
        - "Framework"
        - "Methodology"
        - "Principles"
        - "Patterns"
        - "Checklist"
        - "Template"
        - "Strategy"
        - "System"
        - "Process"
        - "Best Practice"
      keywords_false:
        - "纯叙事"
        - "个人感悟"
        - "无结构"
        - "漫谈"
        - "Narrative Only"
        - "Personal Reflection"
        - "Unstructured"
    - id: "q3_executable"
      question: "读者读完精简版后能够独立执行核心任务"
      weight: 4
      keywords_true:
        - "代码"
        - "实现"
        - "配置"
        - "部署"
        - "操作"
        - "练习"
        - "实验"
        - "项目"
        - "实战"
        - "动手"
        - "Code"
        - "Implementation"
        - "Configuration"
        - "Deployment"
        - "Exercise"
        - "Lab"
        - "Project"
        - "Task"
        - "Recipe"
        - "How-to"
      keywords_false:
        - "纯理论"
        - "原理探讨"
        - "概念介绍"
        - "思想随笔"
        - "Theoretical Only"
        - "Concept Introduction"
        - "Philosophy"
  # 决策阈值
  decision:
    excellent_threshold: 8
    good_threshold: 6
    caution_threshold: 4
    excellent_label: "非常适合"
    good_label: "适合"
    caution_label: "谨慎适合"
    poor_label: "不适合"

# 图片配置
summarizer:
  core_insight_length: "300-500"
  chapter_summary_length: "150-200"
  max_quotes: 10
  max_content_length: 10000
  prompt: |
    你是一位专业的书籍摘要专家。请为以下书籍内容生成精简摘要：
    
    【书名】: {title}
    【作者】: {author}
    
    【要求】:
    1. 核心观点：用 {core_insight_length} 字概括全书核心思想
    2. 章节摘要：为每个章节生成 {chapter_summary_length} 字摘要
    3. 金句摘录：提取 {max_quotes} 条最有价值的句子，翻译成中文后输出
    4. 适用人群：说明这本书适合谁阅读
    5. 重要：不要输出书名和作者行
    
    【内容】:
    {content}
    
    请直接以 Markdown 格式输出，不要任何包裹：
    
    ## 核心观点
    
    [核心观点内容]
    
    ## 章节摘要
    
    ### [章节标题1]
    
    [章节摘要内容1]
    
    ### [章节标题2]
    
    [章节摘要内容2]
    
    ## 金句摘录
    
    - [金句1]
    - [金句2]
    - [金句3]
    
    ## 适用人群
    
    [适用人群说明]

# 文案生成配置
copywriting:
  xianyu_listing_prompt: |
    你是一个闲鱼电子书卖家。以下是该书的摘要内容，请基于此生成商品文案。

    书名：{title}
    作者：{author}

    【书籍摘要】
    {summary}

    ## 生成闲鱼销售文案

    基于以上摘要内容，撰写一篇600字以内的书籍文案。

    ### 要求：
    - 语气简洁接地气，带"实话实说"的诚实感，不吹不黑，甚至可自曝槽点
    - 禁止出现"震撼全球""改变命运"等夸张词汇

    ### 文案必须包含以下模块（顺序可微调）：

    爆款标题（只输出文字，不要输出"爆款标题"四个字，不超过20个字符）

    【作者简介】

    【一句话总结】

    【适合谁看】

    【核心内容】（3-5个要点，用简洁短语或短句）

    【优点】（2-4条）

    【缺点】（不超过3条，客观指出槽点）

    【个人看法】（短评，明确说"建议哪些人买"和"哪些人不适合买"）

    ### 固定内容（必须原样附在文案末尾）

    两种版本可选：
    1、英文原版；
    2、英文+中译+双语+精简版；（精简版为原书核心内容概括以及章节摘要）

    【注意】
    虚拟商品、发货后不支持退换，有问题随时私聊

    【声明】所有资料均来自网络公开渠道，仅供学习交流使用，所有版权归版权方所有，收费为资料整理费用，非书籍自身价值，如版权方认为侵犯了您的版权，请及时联系小店删除

    ### 相关标签

    只输出5-8个标签，以 # 开头，空格分隔，不输出"相关标签"等字。示例：#标签1 #标签2

  xiaohongshu_note_prompt: |
    你是一位小红书读书博主。请为以下书籍生成种草笔记。

    书名：{title}
    作者：{author}

    【要求】:
    1. 标题：爆款风格，带 emoji，20字内
    2. 正文：
       - 开头：痛点引入或金句
       - 中间：书籍介绍 + 核心价值
       - 结尾：推荐理由 + 获取方式
    3. 使用 emoji 增加可读性
    4. 语气：亲切、真实、像朋友推荐
    5. 结尾加上：#读书 #好书推荐 #书单 #自我提升 #英文原版

    请按 Markdown 格式输出。

# 图片配置
image:
  max_width: 1200
  max_height: 1600
  quality: 85
  format: "jpg"

# 闲管家配置
xianyu:
  login_method: "qr_code"
  base_url: "https://seller.goofish.com"
  timeout: 30
  auto_retry: true
  inventory: 100
  location: "深圳北站"
  shipping: "包邮"
  cookie_path: "data/xianyu_cookie.json"
  max_retries: 3
  retry_interval: 2

# 错误处理配置
error_handling:
  api_error: "retry"
  file_error: "skip"
  parse_error: "skip"
  publish_error: "manual"

# 图片生成器配置
image_generator:
  enabled: true
  width: 800
  height: 800
  design_prompt: |
      你是一个电商主图设计专家。根据以下书籍信息，输出4张商品主图的具体设计方案。

      书名：{title}
      作者：{author}

      【书籍摘要】
      {summary}

      请输出以下内容（200字以内）：

      1. 整体视觉方向（一句话，如：专业沉稳/清新自然/高端大气），确保有视觉冲击感、层次分明

      约束：
      - 所有背景必须使用浅色系且极淡（视觉上接近白色但有微弱色相倾向），不能出现深色背景，图2-图4的页面背景统一使用纯白色
      - 4张图尽量选择不同的色系，差异明显，避免所有图都用同一种颜色
      - 图片内部组件可以使用圆角，图片自身不使用圆角
      - 整体内容居中显示（上下、左右均居中）

      布局方案从以下选择（图2、图3、图4必须使用不同的布局方案）：
      - 居中大图：封面居中，占整个画面30%，文字上下分布（仅用于图1）
      - 卡片列表：标题+多个独立卡片，卡片横向或纵向排列
      - 标签展示：标题+多个标签/区块，水平排列,左侧打勾
      - 双栏对比：左右分栏，左列标题/图标，右列说明文字
      - 中心辐射：中心主题，四周环绕子项，用线条连接
      - 2×2网格：四个象限放置内容

  html_prompt: |
      {design_plan}

      你是一个专业电商主图设计师。根据以上设计方案生成闲鱼商品主图的HTML代码。

      书名：{title}
      作者：{author}

      【书籍摘要】
      {summary}

      ## 设计要求

      生成4张商品主图，每张图放在一个 <div class="page"></div> 容器中，每个 .page 容器宽800px、高800px，不使用圆角（border-radius: 0）。

      ### 第一张图：封面展示
      - 封面图会在后续用真实数据替换，请在HTML中使用以下格式引用：
        <img src="data:image/jpeg;base64,__COVER_PLACEHOLDER__" alt="封面" style="height:320px;width:auto;border-radius:0;">
      - 布局和背景：封面高度固定260px（即画面高度的1/3），保持封面原始比例不变形，其它按设计方案确定
      - 书名：翻译成中文展示（特大字号50-60px，从封面提取的深色主色调加粗），居中显示
      - 作者：中等字号，位于书名下方，居中显示，示例：xxx 编著
      - 一句话卖点：从摘要中提炼一句核心卖点（大字号40-45px，从封面提取的深色主色调加粗），位于封面下方，居中显示，必须包含
      - 间距：封面与上方文字间距30px，与下方标签间距25px，固定不变
      - 效果：封面添加box-shadow: 0 20px 50px rgba(0,0,0,0.25)，增加立体感

      ### 第二张图：用户学完本书能学到哪些知识或技能
      - 标题："能学到什么"（使用特大字号50-60px，从封面提取的深色主色调加粗，居中显示）
      - 内容：从摘要中提炼3-4个读者能从书中学到的技能或知识点，每个要点用简短的标题+一句话说明，前面加图标
      - 卡片背景：每个要点使用PPT常用风格的浅色背景色块包裹（如淡蓝色、淡橙色、淡绿色、淡紫色、淡粉色等柔和配色），避免深色，确保与白色背景清晰区分
      - 效果：卡片添加轻微阴影box-shadow: 0 8px 20px rgba(0,0,0,0.15)，增强立体感
      - 布局：严格遵循设计方案中指定的layout值，必须与图3、图4的布局不同，背景使用纯白色
      - 字体：要点标题使用较大字号（20-24px）从封面提取的深色主色调加粗，说明文字常规（14-16px）
      - 视觉引导：图标放大1.2-1.5倍增强视觉吸引力，可添加微妙的装饰分隔线或边框增强层次感

      ### 第三张图：适合谁阅读
      - 标题："适合谁阅读"（使用特大字号50-60px，从封面提取的深色主色调加粗，居中显示）
      - 内容：根据摘要内容提炼2-3类目标读者群体，每类包含人群名称和原因简述
      - 卡片背景：每个读者群体使用PPT常用风格的浅色背景色块包裹（如淡蓝色、淡橙色、淡绿色、淡紫色、淡粉色等柔和配色），避免深色，确保与白色背景清晰区分
      - 效果：卡片添加轻微阴影box-shadow: 0 8px 20px rgba(0,0,0,0.15)，增强立体感
      - 布局：严格遵循设计方案中指定的layout值，必须与图2、图4的布局不同，背景使用纯白色
      - 字体：要点标题使用较大字号（20-24px）从封面提取的深色主色调加粗，说明文字常规（14-16px）
      - 视觉引导：图标放大1.2-1.5倍增强视觉吸引力，可添加微妙的装饰分隔线或边框增强层次感

      ### 第四张图：书籍框架
      - 标题："目录内容"（使用特大字号50-60px，从封面提取的深色主色调加粗，居中显示）
      - 内容：基于摘要推断3-5个主要模块/部分，按逻辑顺序排列,每个模块后注明对应的章节范围
      - 卡片背景：每个模块使用PPT常用风格的浅色背景色块包裹（如淡蓝色、淡橙色、淡绿色、淡紫色、淡粉色等柔和配色），避免深色，确保与白色背景清晰区分
      - 效果：卡片添加轻微阴影box-shadow: 0 8px 20px rgba(0,0,0,0.15)，增强立体感
      - 布局：严格遵循设计方案中指定的layout值，必须与图2、图3的布局不同，背景使用纯白色
      - 字体：要点标题使用较大字号（20-24px）从封面提取的深色主色调加粗，说明文字常规（14-16px）
      - 视觉引导：图标放大1.2-1.5倍增强视觉吸引力，可添加微妙的装饰分隔线或边框增强层次感

      ### 通用要求：
      - 所有文案必须基于书籍摘要内容，不得编造
      - 对于书中的赠送内容和在线资源，不要直接在图片中展示
      - 每张图底部添加标签"支持PDF+EPUB双格式"、"英文+中译+双语+精简版"，标签分开展示，选择不同背景色，居中显示
      - 所有文字使用中文
      - 图片为800×800像素方形
      - 每个 .page 中不要有滚动条
      - 只输出HTML代码，不要加```html```标记

      ### CSS质量标准：
      - 结构稳定：文字不溢出、不折行，所有内容在 .page 容器区域内完整展示，使用 overflow:hidden 防止内容溢出；每张图高度必须恰好800px，无滚动条
      - 视觉冲击：使用特大字号50-60px加粗字体制造焦点，要点标题20-24px、说明文字14-16px，形成明显大小层级；文字使用从封面提取的深色主色调，确保高对比度；
      - 内容卡片/区块使用PPT常用风格的柔和浅色背景（如淡蓝色、淡橙色、淡绿色、淡紫色、淡粉色等），同一张图中不同卡片使用不同配色，确保与白色背景清晰区分
      - 图2、图3、图4的HTML结构和视觉样式必须互不相同，禁止重复使用同一种布局模式
      - 布局协调：所有页面左右边距统一60-70px，创造充足呼吸感，所有内容垂直居中显示（使用 display:flex;flex-direction:column;justify-content:center），上下空间均衡，避免内容偏上或偏下；相同层级元素保持一致的字体大小、颜色和间距，卡片之间间距25-30px，标题与内容间距30-40px；整体居中对齐，视觉平衡
      - 视觉引导：图标放大1.2-1.5倍增强视觉吸引力，可添加微妙的装饰分隔线或边框增强层次感，整体节奏清晰有重点

