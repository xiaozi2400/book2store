# 电子书自动化处理系统配置文件

# 路径配置
paths:
  input_dir: "E:\\ebooks\\input"
  output_dir: "./output"
  data_dir: "./data"
  log_dir: "./logs"

# SKU配置
sku:
  - name: "纯英文原版"
    price: 3.99
    includes:
      - "english_pdf"
  - name: "完整套装"
    price: 8.99
    includes:
      - "english_pdf"
      - "chinese_pdf"
      - "bilingual_pdf"
      - "summary_pdf"

# AI配置
ai:
  provider: "deepseek"
  max_tokens: 4096
  temperature: 0.7
  retry_times: 3
  retry_delay: 5

# MiniMax AI配置
minimax:
  enabled: true
  provider: "minimax"
  model: "MiniMax-M2.7"  # MiniMax 2.7 模型
  api_key: ""  # 请设置环境变量 MINIMAX_API_KEY
  api_url: "https://api.minimax.io/v1/text/chatcompletion_v2"
  max_tokens: 4096
  temperature: 0.7
  retry_times: 3

# 精简版适合度评估配置
suitability_eval:
  version: "1.1"
  # 前置检查：不符合条件的书籍直接跳过
  precheck:
    min_pages: 150
    exclude_types:
      - "小说"
      - "诗歌"
      - "散文"
      - "回忆录"
      - "自传"
      - "故事集"
      - "文集"
      - "Novel"
      - "Poetry"
      - "Essay"
      - "Memoir"
      - "Fiction"
      - "Anthology"
      - "Autobiography"
  # 评估标准
  criteria:
    - id: "q1_purpose"
      question: "读者阅读目的是学会怎么做，而非体验阅读过程"
      weight: 3
      keywords_true:
        - "如何"
        - "步骤"
        - "指南"
        - "手册"
        - "实战"
        - "教程"
        - "入门"
        - "精通"
        - "Blueprint"
        - "Workshop"
        - "for Dummies"
        - "Cookbook"
        - "Handbook"
        - "Guide"
        - "How-to"
        - "Step-by-step"
        - "101"
        - "Mastering"
      keywords_false:
        - "回忆录"
        - "自传"
        - "小说"
        - "散文"
        - "诗歌"
        - "故事集"
        - "文集"
        - "Memoir"
        - "Novel"
        - "Poetry"
        - "Fiction"
        - "Anthology"
        - "Autobiography"
    - id: "q2_extractable"
      question: "核心价值可以提取、概括、结构化而不失真"
      weight: 3
      keywords_true:
        - "框架"
        - "模型"
        - "方法论"
        - "原则"
        - "模式"
        - "清单"
        - "模板"
        - "策略"
        - "系统"
        - "Framework"
        - "Methodology"
        - "Principles"
        - "Patterns"
        - "Checklist"
        - "Template"
        - "Strategy"
        - "System"
        - "Process"
        - "Best Practice"
      keywords_false:
        - "纯叙事"
        - "个人感悟"
        - "无结构"
        - "漫谈"
        - "Narrative Only"
        - "Personal Reflection"
        - "Unstructured"
    - id: "q3_executable"
      question: "读者读完精简版后能够独立执行核心任务"
      weight: 4
      keywords_true:
        - "代码"
        - "实现"
        - "配置"
        - "部署"
        - "操作"
        - "练习"
        - "实验"
        - "项目"
        - "实战"
        - "动手"
        - "Code"
        - "Implementation"
        - "Configuration"
        - "Deployment"
        - "Exercise"
        - "Lab"
        - "Project"
        - "Task"
        - "Recipe"
        - "How-to"
      keywords_false:
        - "纯理论"
        - "原理探讨"
        - "概念介绍"
        - "思想随笔"
        - "Theoretical Only"
        - "Concept Introduction"
        - "Philosophy"
  # 决策阈值
  decision:
    excellent_threshold: 8
    good_threshold: 6
    caution_threshold: 4
    excellent_label: "非常适合"
    good_label: "适合"
    caution_label: "谨慎适合"
    poor_label: "不适合"

# 图片配置
summarizer:
  core_insight_length: "300-500"
  chapter_summary_length: "150-200"
  max_quotes: 15
  max_content_length: 10000
  prompt: |
    你是一位专业的书籍摘要专家。请为以下书籍内容生成精简摘要：
    
    【书名】: {title}
    【作者】: {author}
    
    【要求】:
    1. 核心观点：用 {core_insight_length} 字概括全书核心思想
    2. 章节摘要：为每个章节生成 {chapter_summary_length} 字摘要
    3. 金句摘录：提取 {max_quotes} 条最有价值的句子
    4. 适用人群：说明这本书适合谁阅读
    5. 重要：不要输出书名和作者行，直接从「## 核心观点」开始
    
    【内容】:
    {content}
    
    请直接以 Markdown 格式输出，不要任何包裹：
    
    ## 核心观点
    
    [核心观点内容]
    
    ## 章节摘要
    
    ### [章节标题1]
    
    [章节摘要内容1]
    
    ### [章节标题2]
    
    [章节摘要内容2]
    
    ## 金句摘录
    
    - [金句1]
    - [金句2]
    - [金句3]
    
    ## 适用人群
    
    [适用人群说明]

# 图片配置
image:
  max_width: 1200
  max_height: 1600
  quality: 85
  format: "jpg"

# 闲管家配置
xianyu:
  login_method: "qr_code"
  base_url: "https://www.xianyu.com"
  timeout: 30
  auto_retry: true

# 错误处理配置
error_handling:
  api_error: "retry"
  file_error: "skip"
  parse_error: "skip"
  publish_error: "manual"
