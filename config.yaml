# 电子书自动化处理系统配置文件

# 路径配置
paths:
  input_dir: "./data/input"
  output_dir: "./data/output"
  log_dir: "./logs"

# SKU配置
sku:
  - name: "英文原版"
    price: 1.99
  - name: "英文+双语+中译"
    price: 5.99

# AI配置
# 注意：api_key 留空，生产环境通过环境变量 DEEPSEEK_API_KEY 注入
ai:
  provider: "deepseek"
  api_key: ""
  retry_times: 3

# 文案生成配置
copywriting:
  xianyu_listing_prompt: |
    你是一个闲鱼电子书卖家。以下是该书的摘要内容，请基于此生成商品文案。

    书名：{title}
    作者：{author}

    【书籍摘要】
    {summary}

    ## 生成闲鱼销售文案

    基于以上摘要内容，撰写一篇600字以内的书籍文案。

    ### 要求：
    - 语气简洁接地气，带"实话实说"的诚实感，不吹不黑，甚至可自曝槽点
    - 禁止出现"震撼全球""改变命运"等夸张词汇

    ### 文案必须包含以下模块（顺序可微调）：

    爆款标题（只输出文字，不要输出"爆款标题"四个字，不超过20个字符）

    【作者简介】

    【一句话总结】

    【适合谁看】

    【核心内容】（3-5个要点，用简洁短语或短句）

    【优点】（2-4条）

    【缺点】（不超过3条，客观指出槽点）

    【个人看法】（短评，明确说"建议哪些人买"和"哪些人不适合买"）

    ### 固定内容（必须原样附在文案末尾）

    两种版本可选：
    1、英文原版；
    2、英文+中译+双语；

    【注意】
    虚拟商品、发货后不支持退换，有问题随时私聊

    【声明】所有资料均来自网络公开渠道，仅供学习交流使用，所有版权归版权方所有，收费为资料整理费用，非书籍自身价值，如版权方认为侵犯了您的版权，请及时联系小店删除

    ### 相关标签

    只输出5-8个标签，以 # 开头，空格分隔，不输出"相关标签"等字。示例：#标签1 #标签2

  xiaohongshu_note_prompt: |
    你是一位小红书读书博主。请为以下书籍生成种草笔记。

    书名：{title}
    作者：{author}

    【要求】:
    1. 标题：爆款风格，带 emoji，20字内
    2. 正文：
       - 开头：痛点引入或金句
       - 中间：书籍介绍 + 核心价值
       - 结尾：推荐理由 + 获取方式
    3. 使用 emoji 增加可读性
    4. 语气：亲切、真实、像朋友推荐
    5. 结尾加上：#读书 #好书推荐 #书单 #自我提升 #英文原版

    请按 Markdown 格式输出。

# 闲管家配置
xianyu:
  base_url: "https://seller.goofish.com"
  timeout: 30
  inventory: 100
  shipping: "包邮"
  cookie_path: "data/xianyu_cookie.json"
  max_retries: 3
  retry_interval: 2
  headless: true

# 精简版生成配置
summarizer:
  core_insight_length: "300-500"
  chapter_summary_length: "150-200"
  max_quotes: 10
  prompt: |
    你是一位专业的书籍摘要专家。请为以下书籍内容生成精简摘要：

    【书名】: {title}
    【作者】: {author}

    【要求】:
    1. 核心观点：用 {core_insight_length} 字概括全书核心思想
    2. 章节摘要：为每个章节生成 {chapter_summary_length} 字摘要
    3. 金句摘录：提取 {max_quotes} 条最有价值的句子，翻译成中文后输出
    4. 适用人群：说明这本书适合谁阅读
    5. 重要：不要输出书名和作者行

    【内容】:
    {content}

    请直接以 Markdown 格式输出，不要任何包裹：

    ## 核心观点

    [核心观点内容]

    ## 章节摘要

    ### [章节标题1]

    [章节摘要内容1]

    ### [章节标题2]

    [章节摘要内容2]

    ## 金句摘录

    - [金句1]
    - [金句2]
    - [金句3]

    ## 适用人群

    [适用人群说明]

# 质量检查配置
quality_check:
  enabled: true
  thresholds:
    excellent: 90
    good: 75
    pass: 60

# 图片生成器配置
image_generator:
  enabled: true
  width: 800
  height: 800
  device_scale_factor: 2
  screenshot_quality: 92
  color_theme: light
  palettes:
    # ── 深色系 ──
    - name: 经典深沉
      theme: dark
      colors: ["#1A365D", "#276749", "#553C9A", "#9B2C2C"]
    - name: 午夜宝石
      theme: dark
      colors: ["#1E1B4B", "#134E4A", "#78350F", "#7F1D1D"]
    - name: 暮色都市
      theme: dark
      colors: ["#0F172A", "#4C1D95", "#831843", "#065F46"]
    - name: 高级商务
      theme: dark
      colors: ["#1F2937", "#374151", "#7C2D12", "#1E40AF"]
    - name: 秋日大地
      theme: dark
      colors: ["#78350F", "#3F6212", "#7C2D12", "#365314"]
    - name: 极光冷调
      theme: dark
      colors: ["#0C4A6E", "#134E4A", "#312E81", "#1E3A8A"]
    - name: 深夜霓虹
      theme: dark
      colors: ["#4A044E", "#164E63", "#7C2D12", "#1E1B4B"]
    - name: 摩登轻奢
      theme: dark
      colors: ["#3F3F46", "#701A75", "#134E4A", "#7C2D12"]
    # ── 浅色系 ──
    - name: 暖阳纸页
      theme: light
      bg: "#FFFDF8"
      accents: ["#E8D5B7", "#C4A882", "#8B6914"]
    - name: 薄荷静谧
      theme: light
      bg: "#F7FBF9"
      accents: ["#A8C5B8", "#5B8A72", "#2D5A45"]
    - name: 柔暮玫瑰
      theme: light
      bg: "#FEF9FA"
      accents: ["#DDBAC7", "#A85C7C", "#6B334D"]
    - name: 晴空蓝调
      theme: light
      bg: "#F5F8FD"
      accents: ["#9DB8E0", "#4A6FA5", "#2C4A7C"]
    - name: 薰衣草田
      theme: light
      bg: "#F9F7FC"
      accents: ["#C9BCE0", "#8B6FAE", "#5A4070"]
    - name: 水泥极简
      theme: light
      bg: "#FAFAF9"
      accents: ["#C8C4BC", "#7A7670", "#3D3B38"]
  design_prompt: |
      为下列书籍规划 4 张 800x800 商品主图方案(PPT 高级感)。
      图 2/3/4 布局**固定**:图2=2x2网格,图3=标签展示,图4=双栏对比。

      书名：{title}  作者：{author}  封面配色：{cover_colors}
      摘要：{summary}

      # 项数(从摘要提炼)
      N2=能学到的知识点数,**固定 4** | N3=目标读者类别数,3~5 | N4=主要模块/目录内容,≤10

      # 配色(本次已为你选定:**{palette_name}**,渲染器自动分配 4 色到图 1/2/3/4,深浅主题由配置决定,你不需要回写 HEX)
      {palette_lines}

      # 输出格式(严格,无 markdown 无解释)
      视觉方向: <一个词>
      图3 项数: <3|4|5>
      图4 项数: <5|6|7|8|9|10>

  html_prompt: |
      {design_plan}

      按上方"设计方案"和下列书籍信息,输出**纯 JSON**(不要 markdown 代码块,不要解释)描述 4 张主图内容。CSS/HTML 骨架和布局由渲染器提供,你只填内容。

      书名：{title}   作者：{author}
      摘要：{summary}

      # 输出 schema(必须严格匹配,键与结构不可变;page2/3/4 是**对象**{"items":[...]},不是数组!)
      {
        "page1": {"title": "书名(中文,≤14字)", "author": "作者名", "subline": "3~4关键词·分隔", "quote": "卖点≤20字"},
        "page2": {"items": [{"icon":"🧠","title":"标题≤7字","desc":"说明≤24字"}, ...共 4 项]},
        "page3": {"items": [{"icon":"🎓","label":"人群≤4字","desc":"理由≤10字"}, ...N3 项]},
        "page4": {"items": [{"chapter":"第N章 章节名(≤14字,必带\"第N章\"前缀)","brief":"章节要点≤22字，>=10字"}, ...N4 项]}
      }

      # 规则
      1. page2 items 恒为 4 项;page3 = N3 项(3~5);page4 = N4 项(5~10)
      2. page4 **必须覆盖全书完整目录**,不得截断/省略后段章节。当实际章节数 > N4 时,按主题相关性把相邻章节**合并**为一项(相邻/主题相近才合并,不跨大板块),使总项数等于 N4;合并后 chapter 用范围表示,如"第一~三章 章节名"或"第1-3章 章节名";brief 覆盖被合并章节的共同要点
      3. page4 chapter 字段**必须**以"第一章/第二章/..."或"第1章/第2章/..."(中文数字优先)开头,顺序对应书的章节顺序;合并项按前述范围格式;brief 是该章节的一句话要点
      4. 允许 emoji:🧠 ⚡ 🎯 🔋 📌 🚀 💡 📚 🎓 ✍️ 👨‍💻 📐 🧭 🌱 ✅
      5. 只输出 JSON 对象本身,首字符 `{`,末字符 `}`
