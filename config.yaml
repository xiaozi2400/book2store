# 电子书自动化处理系统配置文件

# 路径配置
paths:
  input_dir: "E:\\ebooks\\input"
  output_dir: "./output"
  data_dir: "./data"
  log_dir: "./logs"

# SKU配置
sku:
  - name: "英文原版"
    price: 1.99
    includes:
      - "english_pdf"
  - name: "英文+双语+中译+精简版"
    price: 5.99
    includes:
      - "english_pdf"
      - "chinese_pdf"
      - "bilingual_pdf"
      - "summary_pdf"

# AI配置
ai:
  provider: "deepseek"
  max_tokens: 4096
  temperature: 0.7
  retry_times: 3
  retry_delay: 5

# MiniMax AI配置
minimax:
  enabled: true
  provider: "minimax"
  model: "MiniMax-M2.7"  # MiniMax 2.7 模型
  api_key: ""  # 请设置环境变量 MINIMAX_API_KEY
  api_url: "https://api.minimax.io/v1/text/chatcompletion_v2"
  max_tokens: 4096
  temperature: 0.7
  retry_times: 3

# 精简版适合度评估配置
suitability_eval:
  version: "1.1"
  # 前置检查：不符合条件的书籍直接跳过
  precheck:
    min_pages: 150
    exclude_types:
      - "小说"
      - "诗歌"
      - "散文"
      - "回忆录"
      - "自传"
      - "故事集"
      - "文集"
      - "Novel"
      - "Poetry"
      - "Essay"
      - "Memoir"
      - "Fiction"
      - "Anthology"
      - "Autobiography"
  # 评估标准
  criteria:
    - id: "q1_purpose"
      question: "读者阅读目的是学会怎么做，而非体验阅读过程"
      weight: 3
      keywords_true:
        - "如何"
        - "步骤"
        - "指南"
        - "手册"
        - "实战"
        - "教程"
        - "入门"
        - "精通"
        - "Blueprint"
        - "Workshop"
        - "for Dummies"
        - "Cookbook"
        - "Handbook"
        - "Guide"
        - "How-to"
        - "Step-by-step"
        - "101"
        - "Mastering"
      keywords_false:
        - "回忆录"
        - "自传"
        - "小说"
        - "散文"
        - "诗歌"
        - "故事集"
        - "文集"
        - "Memoir"
        - "Novel"
        - "Poetry"
        - "Fiction"
        - "Anthology"
        - "Autobiography"
    - id: "q2_extractable"
      question: "核心价值可以提取、概括、结构化而不失真"
      weight: 3
      keywords_true:
        - "框架"
        - "模型"
        - "方法论"
        - "原则"
        - "模式"
        - "清单"
        - "模板"
        - "策略"
        - "系统"
        - "Framework"
        - "Methodology"
        - "Principles"
        - "Patterns"
        - "Checklist"
        - "Template"
        - "Strategy"
        - "System"
        - "Process"
        - "Best Practice"
      keywords_false:
        - "纯叙事"
        - "个人感悟"
        - "无结构"
        - "漫谈"
        - "Narrative Only"
        - "Personal Reflection"
        - "Unstructured"
    - id: "q3_executable"
      question: "读者读完精简版后能够独立执行核心任务"
      weight: 4
      keywords_true:
        - "代码"
        - "实现"
        - "配置"
        - "部署"
        - "操作"
        - "练习"
        - "实验"
        - "项目"
        - "实战"
        - "动手"
        - "Code"
        - "Implementation"
        - "Configuration"
        - "Deployment"
        - "Exercise"
        - "Lab"
        - "Project"
        - "Task"
        - "Recipe"
        - "How-to"
      keywords_false:
        - "纯理论"
        - "原理探讨"
        - "概念介绍"
        - "思想随笔"
        - "Theoretical Only"
        - "Concept Introduction"
        - "Philosophy"
  # 决策阈值
  decision:
    excellent_threshold: 8
    good_threshold: 6
    caution_threshold: 4
    excellent_label: "非常适合"
    good_label: "适合"
    caution_label: "谨慎适合"
    poor_label: "不适合"

# 图片配置
summarizer:
  core_insight_length: "300-500"
  chapter_summary_length: "150-200"
  max_quotes: 10
  max_content_length: 10000
  prompt: |
    你是一位专业的书籍摘要专家。请为以下书籍内容生成精简摘要：
    
    【书名】: {title}
    【作者】: {author}
    
    【要求】:
    1. 核心观点：用 {core_insight_length} 字概括全书核心思想
    2. 章节摘要：为每个章节生成 {chapter_summary_length} 字摘要
    3. 金句摘录：提取 {max_quotes} 条最有价值的句子，翻译成中文后输出
    4. 适用人群：说明这本书适合谁阅读
    5. 重要：不要输出书名和作者行
    
    【内容】:
    {content}
    
    请直接以 Markdown 格式输出，不要任何包裹：
    
    ## 核心观点
    
    [核心观点内容]
    
    ## 章节摘要
    
    ### [章节标题1]
    
    [章节摘要内容1]
    
    ### [章节标题2]
    
    [章节摘要内容2]
    
    ## 金句摘录
    
    - [金句1]
    - [金句2]
    - [金句3]
    
    ## 适用人群
    
    [适用人群说明]

# 文案生成配置
copywriting:
  xianyu_listing_prompt: |
    你是一个闲鱼二手书卖家。用户提供了以下书籍信息：

    书名：{title}
    作者：{author}

    请你执行以下步骤：

    ## 1、自动搜索（真实优先）

    根据用户提供的信息，必须通过联网搜索获取该书的真实资料。若搜索不到真实信息，请明确告知用户"未找到该书资料，请提供更准确的信息"。搜索内容包括：

    - 书名、作者、出版年份、出版社
    - 内容简介（优先引用官方介绍、豆瓣/亚马逊摘要）
    - 目录结构（可选，如有价值则提取）
    - 常见读者评价（需分别列出正面评价2条 + 负面评价2条，作为优缺点依据）
    - 书籍类型（如：经济/理财/个人成长/AI/编程/副业/小说/历史等）

    ## 2、生成闲鱼销售文案

    基于搜索到的真实资料，撰写一篇600字以内的书籍文案。

    ### 要求：
    - 语气简洁接地气，带"实话实说"的诚实感，不吹不黑，甚至可自曝槽点
    - 禁止出现"震撼全球""改变命运"等夸张词汇

    ### 文案必须包含以下模块（顺序可微调）：

    爆款标题（只输出文字，不要输出"爆款标题"四个字，不超过20个字符）

    【作者简介】

    【一句话总结】

    【适合谁看】

    【核心内容】（3-5个要点，用简洁短语或短句）

    【优点】（2-4条，从正面评价中提炼）

    【缺点】（不超过3条，从负面评价中提炼，客观指出槽点）

    【个人看法】（短评，明确说"建议哪些人买"和"哪些人不适合买"）

    ### 固定内容（必须原样附在文案末尾）

    两种规格可供选择：
    1、英文原版；
    2、英文+中译+双语+精简版；

    【注意】
    虚拟商品、发货后不支持退换，有问题随时私聊

    【声明】所有资料均来自网络公开渠道，仅供学习交流使用，所有版权归版权方所有，收费为资料整理费用，非书籍自身价值，如版权方认为侵犯了您的版权，请及时联系小店删除

    ### 相关标签

    只输出5-8个标签，以 # 开头，空格分隔，不输出"相关标签"等字。示例：#标签1 #标签2

  xiaohongshu_note_prompt: |
    你是一位小红书读书博主。请为以下书籍生成种草笔记。

    书名：{title}
    作者：{author}

    【要求】:
    1. 标题：爆款风格，带 emoji，20字内
    2. 正文：
       - 开头：痛点引入或金句
       - 中间：书籍介绍 + 核心价值
       - 结尾：推荐理由 + 获取方式
    3. 使用 emoji 增加可读性
    4. 语气：亲切、真实、像朋友推荐
    5. 结尾加上：#读书 #好书推荐 #书单 #自我提升 #英文原版

    请按 Markdown 格式输出。

# 图片配置
image:
  max_width: 1200
  max_height: 1600
  quality: 85
  format: "jpg"

# 闲管家配置
xianyu:
  login_method: "qr_code"
  base_url: "https://seller.goofish.com"
  timeout: 30
  auto_retry: true
  inventory: 100
  location: "深圳北站"
  shipping: "包邮"
  cookie_path: "data/xianyu_cookie.json"
  max_retries: 3
  retry_interval: 2

# 错误处理配置
error_handling:
  api_error: "retry"
  file_error: "skip"
  parse_error: "skip"
  publish_error: "manual"
